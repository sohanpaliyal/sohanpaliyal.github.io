<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="grid-preat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="0" />
      <stop offset="50%" stop-color="#430B8A" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0" />
    </linearGradient>
     <linearGradient id="link-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7AD7FF" />
      <stop offset="100%" stop-color="#430B8A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#100d25" />
  
  <!-- Subtle Grid -->
  <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800" stroke="url(#grid-preat)" stroke-width="1" />
  <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600" stroke="url(#grid-preat)" stroke-width="1" />

  <!-- Connections -->
  <path d="M400 150 L400 300" stroke="url(#link-gradient)" stroke-width="4" stroke-opacity="0.3" />
  <path d="M400 300 L250 450" stroke="url(#link-gradient)" stroke-width="4" stroke-opacity="0.3" />
  <path d="M400 300 L550 450" stroke="url(#link-gradient)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Animated Bubbles/Signals -->
  <circle cx="400" cy="450" r="6" fill="#7AD7FF">
    <animate attributeName="cy" from="450" to="150" dur="2s" repeatCount="indefinite" values="450; 300; 150" keyTimes="0; 0.5; 1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
    <animate attributeName="opacity" values="1; 1; 0" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Parent Node (Grandparent) -->
  <g transform="translate(400, 150)">
    <circle r="40" fill="#1a1a2e" stroke="#430B8A" stroke-width="3" filter="url(#glow)" />
    <text x="0" y="5" text-anchor="middle" fill="#E6DDFD" font-family="monospace" font-size="14">Window</text>
  </g>

  <!-- Parent Node -->
  <g transform="translate(400, 300)">
    <circle r="35" fill="#1a1a2e" stroke="#0985DF" stroke-width="3" filter="url(#glow)" />
    <text x="0" y="5" text-anchor="middle" fill="#7AD7FF" font-family="monospace" font-size="14">Parent Div</text>
  </g>

  <!-- Child Node (Left - Inactive) -->
  <g transform="translate(250, 450)">
    <circle r="25" fill="#1a1a2e" stroke="#4b5563" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" fill="#4b5563" font-family="monospace" font-size="12">Sibling</text>
  </g>

  <!-- Child Node (Right - Active) -->
  <g transform="translate(400, 450)">
    <circle r="30" fill="#1a1a2e" stroke="#7AD7FF" stroke-width="3" filter="url(#glow)">
        <animate attributeName="stroke-width" values="3;6;3" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle r="15" fill="#7AD7FF" opacity="0.5">
         <animate attributeName="r" values="15;25;15" dur="2s" repeatCount="indefinite" />
         <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">Target</text>
  </g>
  
  <!-- Arrow indicating flow -->
  <path d="M440 440 L440 310" stroke="#7AD7FF" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite" />
  </path>
    <path d="M440 290 L440 160" stroke="#7AD7FF" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite" begin="0.5s" />
  </path>

</svg>
